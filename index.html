

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACN Connect</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7ff;color:#172b4d}
header{background:#0756c9;color:white;padding:22px 16px}
header h2{margin:0}
header p{margin:7px 0 0}
main{padding:16px;padding-bottom:90px}
  section id="create" class="page">
<div class="card">
<h3>Create a Post</h3>
<textarea id="postText" rows="5" placeholder="What would you like to share?"></textarea>
<button onclick="createPost()">Publish Post</button>
</div>
</section>

<section id="earnings" class="page">
<div class="card">
<h3>My Earnings</h3>
<div class="balance">₦0.00</div>
<p>Your earnings balance will appear here.</p>
<p>Note: Real payments and withdrawals will require a secure payment system.</p>
</div>
</section>

<section id="profile" class="page">
<div class="card">
<h3>My Profile</h3>
<input id="username" placeholder="Enter your name">
<input id="email" type="email" placeholder="Enter your email">
<button onclick="saveProfile()">Save Profile</button>
<p id="profileStatus"></p>
</div>
</section>
  </main>

<nav>
<button onclick="showPage('home')">🏠<br>Home</button>
<button onclick="showPage('chat')">💬<br>Chat</button>
<button onclick="showPage('create')">➕<br>Post</button>
<button onclick="showPage('earnings')">💰<br>Earnings</button>
<button onclick="showPage('profile')">👤<br>Profile</button>
</nav>

<script>
function showPage(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function createPost(){
let text=document.getElementById('postText').value.trim();
if(!text){alert('Please write something first.');return;}
let post=document.createElement('div');
post.className='post';
post.textContent=text;
letposts=document.getElementById('posts');
if(posts.textContent.includes('No posts yet'))posts.innerHTML='';
posts.prepend(post);
document.getElementById('postText').value='';
showPage('home');
}

function sendMessage(){
let input=document.getElementById('message');
let text=input.value.trim();
if(!text)return;
let item=document.createElement('p');
item.textContent='You: '+text;
document.getElementById('messages').appendChild(item);
input.value='';
}

function saveProfile(){
document.getElementById('profileStatus').textContent='Profile details entered successfully!';
}
</script>

</body>
</html>
